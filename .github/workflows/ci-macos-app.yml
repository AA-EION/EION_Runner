# ---------------------------------------------------------------------------
# Runner Forge — macOS app CI.
#
# Builds the SwiftPM package, runs the Swift Testing suite, assembles
# RunnerForge.app and wraps it in a DMG.
#
# This is the first place the macOS app is ever fully type-checked. The
# development box is Linux, where `swiftc -parse` proves syntax but cannot
# resolve SwiftUI, AppKit or Security — so a Linux green light means "this
# parses", and only this job means "this compiles".
#
# The DMG is uploaded directly rather than tarred: a .dmg is a single file, so
# upload-artifact has no symlinks to flatten. The .app is a different matter and
# is tarred, because upload-artifact turns a bundle's symlinks into copies and
# the result is no longer a valid bundle.
# ---------------------------------------------------------------------------
name: ci-macos-app

run-name: macOS app · ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'app-macos/**'
      - 'scripts/**'
      - 'templates/**'
      - '.github/workflows/ci-macos-app.yml'

permissions:
  contents: read

concurrency:
  group: ci-macos-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Pinned, and recorded in versions.toml [ci].macos_image_app.
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build
        working-directory: app-macos
        run: swift build -c release

      - name: Test
        working-directory: app-macos
        run: swift test

      - name: Assemble the app and the DMG
        working-directory: app-macos
        run: ./build.sh --configuration release

      # `codesign --verify` on an ad-hoc signature still proves the bundle is
      # structurally valid, which is what this gate is for. Distribution signing
      # needs a Developer ID identity and happens on the signing runner.
      - name: Assert the bundle is well-formed
        working-directory: app-macos
        run: |
          set -euo pipefail
          app="dist/RunnerForge.app"

          test -x "$app/Contents/MacOS/RunnerForge" || { echo "no executable in the bundle"; exit 1; }
          test -f "$app/Contents/Info.plist"        || { echo "no Info.plist in the bundle"; exit 1; }

          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist"

          # The resources are program files, not extras: the Export page renders
          # the templates and the runner classes execute the scripts.
          test -d "$app/Contents/Resources/scripts"    || { echo "scripts missing from the bundle"; exit 1; }
          test -d "$app/Contents/Resources/templates"  || { echo "templates missing from the bundle"; exit 1; }

          codesign --verify --verbose=2 "$app"

          echo "--- entitlements as signed ---"
          codesign --display --entitlements - --xml "$app" |
            plutil -convert xml1 -o - - | tee /tmp/entitlements.xml

          # App Sandbox must be OFF: the app spawns tart, docker, codesign and
          # notarytool, none of which a sandboxed process can launch. This
          # asserts the decision rather than trusting the file.
          if /usr/libexec/PlistBuddy -c 'Print :com.apple.security.app-sandbox' /tmp/entitlements.xml 2>/dev/null | grep -qi true; then
            echo "App Sandbox is enabled; the app cannot drive tart or docker with it on"
            exit 1
          fi

          echo "--- architectures ---"
          lipo -info "$app/Contents/MacOS/RunnerForge"

      - name: Assert the DMG mounts and carries the app
        working-directory: app-macos
        run: |
          set -euo pipefail
          dmg="dist/RunnerForge.dmg"
          ls -l "$dmg"

          hdiutil verify "$dmg"
          mountpoint="$(mktemp -d)"
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mountpoint"
          trap 'hdiutil detach "$mountpoint" >/dev/null 2>&1 || true' EXIT

          ls -l "$mountpoint"
          test -x "$mountpoint/RunnerForge.app/Contents/MacOS/RunnerForge" \
            || { echo "the DMG does not contain a runnable app"; exit 1; }
          test -L "$mountpoint/Applications" \
            || { echo "the DMG has no /Applications drop target"; exit 1; }

          bytes="$(du -sk "$mountpoint/RunnerForge.app" | cut -f1)"
          echo "app inside the DMG: ${bytes} KB"

      # ---------------------------------------------------------------------
      # Launch it.
      #
      # The Windows app shipped once with a startup path that never constructed
      # its window — it built, published and packaged perfectly and opened
      # nothing. SwiftUI's WindowGroup makes that exact failure structurally
      # impossible here, since there is no imperative "show the window" step to
      # forget. What IS possible is a crash during launch, so this checks the
      # realistic failure: that the app starts and stays up.
      # ---------------------------------------------------------------------
      - name: Smoke test — the app launches and stays up
        working-directory: app-macos
        timeout-minutes: 3
        run: |
          set -uo pipefail
          app="dist/RunnerForge.app"
          binary="$app/Contents/MacOS/RunnerForge"

          # Start from no log at all. The test suite constructs a LogBus too and
          # writes to this same path, so without this the error check below would
          # be reading the TEST run's lines and could fail for something that has
          # nothing to do with launching the app.
          rm -f "$HOME/Library/Logs/RunnerForge/runnerforge.log" \
                "$HOME/Library/Logs/RunnerForge/runnerforge.log.1"

          # Run the binary directly rather than `open`: `open` returns
          # immediately and reports nothing about what happened next, so a
          # crash-on-launch would look like success.
          "$binary" > /tmp/runnerforge-stdout.log 2>/tmp/runnerforge-stderr.log &
          pid=$!
          echo "launched pid $pid"

          survived=1
          for _ in $(seq 1 10); do
            sleep 1
            if ! kill -0 "$pid" 2>/dev/null; then survived=0; break; fi
          done

          if [ "$survived" -eq 0 ]; then
            wait "$pid"; status=$?
            echo "--- stdout ---"; cat /tmp/runnerforge-stdout.log
            echo "--- stderr ---"; cat /tmp/runnerforge-stderr.log
            echo "RunnerForge exited during launch with status $status."
            exit 1
          fi

          echo "still running after 10s"

          # The app holds a caffeinate assertion for its lifetime, so killing it
          # deliberately here also proves that child is reaped with it.
          kill "$pid" 2>/dev/null || true
          sleep 2
          kill -9 "$pid" 2>/dev/null || true

          if pgrep -f "caffeinate -dimsu" >/dev/null 2>&1; then
            echo "WARNING: a caffeinate process outlived the app. The Reaper handles"
            echo "         this on the next launch, but it should not happen."
          fi

          # ---------------------------------------------------------------
          # A live process is NOT proof the app works, any more than an open
          # window is on Windows — where InvariantGlobalization made every
          # binding throw while the process sat there perfectly alive. So the
          # log gets read: a clean startup logs no errors at all, and any
          # error before the user has touched anything is a defect.
          # ---------------------------------------------------------------
          log="$HOME/Library/Logs/RunnerForge/runnerforge.log"
          if [ ! -f "$log" ]; then
            echo "--- stdout ---"; cat /tmp/runnerforge-stdout.log
            echo "--- stderr ---"; cat /tmp/runnerforge-stderr.log
            echo "The app ran for 10s and wrote no log at $log."
            exit 1
          fi

          echo "--- $log ---"
          cat "$log"

          if grep -q '\[Error\]' "$log"; then
            count=$(grep -c '\[Error\]' "$log")
            echo ''
            echo "The app logged $count error(s) while merely starting up."
            echo 'A running process is not the same as a working app.'
            exit 1
          fi

          # ---------------------------------------------------------------
          # SECOND LAUNCH. Everything above is a FIRST run: no config exists,
          # the app writes defaults and opens. The failure reported on Windows
          # was on the SECOND run, where the app reads back the file it just
          # wrote — and rejected it, because the fields the GUI exists to
          # collect were still empty. A runner is fresh every time, so a single
          # launch could never have caught it. See TROUBLESHOOTING #22.
          # ---------------------------------------------------------------
          echo ''
          echo 'relaunching, now that a config exists'
          config="$HOME/Library/Application Support/RunnerForge/forge.json"
          if [ ! -f "$config" ]; then
            echo "The first launch did not write $config, so this check would prove nothing."
            exit 1
          fi

          rm -f "$log"

          "$binary" > /tmp/runnerforge-stdout2.log 2>/tmp/runnerforge-stderr2.log &
          pid2=$!

          survived=1
          for _ in $(seq 1 10); do
            sleep 1
            if ! kill -0 "$pid2" 2>/dev/null; then survived=0; break; fi
          done

          if [ "$survived" -eq 0 ]; then
            echo "--- stdout ---"; cat /tmp/runnerforge-stdout2.log
            echo "--- stderr ---"; cat /tmp/runnerforge-stderr2.log
            echo 'The app starts once and then refuses to start again. That is the'
            echo 'signature of a config it writes but will not read back.'
            exit 1
          fi

          kill "$pid2" 2>/dev/null || true
          sleep 2
          kill -9 "$pid2" 2>/dev/null || true

          if [ -f "$log" ] && grep -q '\[Error\]' "$log"; then
            cat "$log"
            echo 'The second launch logged errors reading its own config.'
            exit 1
          fi

          echo 'second launch survived with no errors'
          echo "smoke test passed: the app launches twice, stays up and logs no errors"

      # The .app is tarred and the DMG is not, for the reason in the header.
      - name: Tar the app bundle
        working-directory: app-macos
        run: |
          set -euo pipefail
          tar -cf dist/RunnerForge-app.tar -C dist RunnerForge.app
          ls -l dist/RunnerForge-app.tar

      - name: Upload DMG
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RunnerForge-macos-dmg
          path: app-macos/dist/RunnerForge.dmg
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      - name: Upload the app bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RunnerForge-macos-app
          path: app-macos/dist/RunnerForge-app.tar
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
