# Runner Forge — SINGLE SOURCE OF TRUTH for every pinned version.
#
# RULE: no version string may be hardcoded anywhere else in this repository.
# Dockerfiles, PowerShell/bash scripts, the Windows app and the macOS app all
# read their versions from this file (see scripts/README notes in docs/ARCHITECTURE.md).
#
# `latest`, `main`, unpinned `apt-get install` and unpinned base images are
# forbidden. If a pinned artifact 404s at build time the installer scripts STOP
# and print the exact failing URL — they never fall back to `latest`.
#
# NOTE ON SYNTAX: the project brief sketched several keys on one line separated
# by semicolons (`cmake = "3.31.5"; ninja = "1.12.1"`). That is not valid TOML —
# TOML requires one key/value pair per line — so the same keys are written one
# per line here. Key names and values are otherwise verbatim from the brief.

[runner]
# github/actions-runner release tag (without the leading "v").
actions_runner = "2.328.0"

[windows_image]
base = "mcr.microsoft.com/windows/servercore:ltsc2022"
vs_buildtools = "17.12"
vs_components = [
  "Microsoft.VisualStudio.Workload.VCTools",
  "Microsoft.VisualStudio.Component.VC.Tools.x86.x64",
  "Microsoft.VisualStudio.Component.VC.Tools.ARM64",
  "Microsoft.VisualStudio.Component.Windows11SDK.22621",
  "Microsoft.VisualStudio.Component.VC.CMake.Project",
]
cmake = "3.31.5"
ninja = "1.12.1"
git = "2.47.1"
innosetup = "6.3.3"
sevenzip = "24.09"
sccache = "0.9.0"
python = "3.12.8"
# Image tag applied to the built image: runnerforge/win-build:<tag>
tag = "1.0.0"

[linux_image]
base = "ubuntu:24.04"
# The base is additionally pinned by DIGEST. Individual apt package versions are
# deliberately NOT pinned with `=<version>`: the Ubuntu archive removes
# superseded packages, so a version-pinned apt install starts failing the moment
# a security update lands. Pinning the base image by digest fixes the entire
# package set to one immutable snapshot, which is both reproducible and
# maintainable. Change the digest to move to a newer package set on purpose.
base_digest = "sha256:224a1869083a311ef3f13648a154ba79832fbef6364d31493642ca03082da254"
cmake = "3.31.5"
ninja = "1.12.1"
# Image tag applied to the built image: runnerforge/linux-util:<tag>
tag = "1.0.0"

[macos_image]
tart = "2.27.0"
packer = "1.11.2"
base_image = "ghcr.io/cirruslabs/macos-tahoe-xcode:26"
# Tart image tag produced by images/macos/packer: runnerforge-macos:<tag>
tag = "1.0.0"

[actions]
checkout = "v4"
upload_artifact = "v4"
download_artifact = "v4"

[host_minimums]
docker_desktop = "4.37.0"
windows_build = 22000
macos_version = "26.0"

[project]
# JUCE and clap-juce-extensions revisions consumed by canary/ and by RecRoll.
juce = "8.0.4"
# clap-juce-extensions is pinned by COMMIT SHA, not by tag, and deliberately so.
#
# 2026-09-10, two findings, both recorded in docs/TROUBLESHOOTING.md:
#   1. The initially pinned "1.1.9" does not exist. `git ls-remote --tags` reports
#      only 0.24.0, 0.25.0 and 0.26.0 — the project never reached 1.x.
#   2. Those tags track the *CLAP specification* version, not the extension's own
#      version. The newest of them, 0.26.0, is a commit from 2022-05-31. It does
#      not build against JUCE 8: it includes
#      juce_audio_plugin_client/utility/juce_LinuxMessageThread.h, which JUCE
#      moved to detail/ in 7.0.6. Verified by a real failing compile.
#
# There is therefore no usable tag, and a SHA is the strongest pin available.
# This commit carries the JUCE_VERSION-guarded include that resolves to the
# detail/ path for JUCE >= 7.0.6, which is what JUCE 8.0.4 ships.
clap_juce_extensions = "9fbefae3d9c3d130aafb558c1ec15427a4bd24be"  # main @ 2026-09-09

# ---------------------------------------------------------------------------
# [checksums] — SHA-256 of every binary the image build scripts download.
#
# Populated by `scripts/refresh-checksums.sh` is NOT a thing: these values are
# recorded here by hand after being verified against the publisher. The image
# install scripts treat a MISSING entry as a hard error — they never skip
# verification. Keys are "<tool>_<platform>".
#
# Values marked UNVERIFIED-<reason> cause install-buildtools.ps1 to abort with
# a message naming the key, so a stale pin can never silently produce an
# unverified toolchain.
# ---------------------------------------------------------------------------
[checksums]
runner_linux_x64 = "01066fad3a2893e63e6ca880ae3a1fad5bf9329d60e77ee15f2b97c148c3cd4e"  # 227247880 bytes
runner_win_x64 = "a73ae192b8b2b782e1d90c08923030930b0b96ed394fe56413a073cc6f694877"  # 97717739 bytes
runner_osx_arm64 = "30e8c9e34ae3f1f5004d0fd6eb4e42714d1b489ca9c91f5eed3bcbd29c6f446d"  # 125492648 bytes
cmake_linux_x86_64 = "2984e70515ff60c5e4a41922b5d715a8168a696a89721e3b114e36f453244f72"  # 54990652 bytes
cmake_windows_x86_64 = "d4d2d4b9ccd68dae975a066fcd42ea9807ef40f79ee6971923fd3788e7917585"
cmake_macos_universal = "cc8e3d9bef7eee70db52601a5ed60d221436a8def18388effdab0e7d0866f50d"
ninja_linux = "6f98805688d19672bd699fbbfa2c2cf0fc054ac3df1f0e6a47664d963d530255"  # 123084 bytes
ninja_win = "f550fec705b6d6ff58f2db3c374c2277a37691678d6aba463adcbb129108467a"  # 275425 bytes
ninja_mac = "89a287444b5b3e98f88a945afa50ce937b8ffd1dcc59c555ad9b1baf855298c9"  # 281130 bytes
git_win_x64 = "50b04b55425b5c465d076cdb184f63a0cd0f86f6ec8bb4d5860114a713d2c29a"  # 47241394 bytes
innosetup_win = "0bcb2a409dea17e305a27a6b09555cabe600e984f88570ab72575cd7e93c95e6"  # 5634744 bytes
sevenzip_win_x64 = "bdd1a33de78618d16ee4ce148b849932c05d0015491c34887846d431d29f308e"  # 1637343 bytes
sccache_win_x64 = "35fe3b6348a4a5e693a9c3fff72721599b81a836708cfd943537a83f5434efd9"  # 7787274 bytes
