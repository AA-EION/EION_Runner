# ---------------------------------------------------------------------------
# [urls] — exact download locations. Templated with {v} = the matching version
# from the tables above. The install scripts substitute {v} and nothing else.
#
# CHANGE LOG (§16 requires that a 404 is reported, not silently worked around):
#   2026-09-10  https://files.jrsoftware.org/is/6/innosetup-6.3.3.exe returned
#               HTTP 404. The jrsoftware download host no longer serves 6.x
#               binaries directly; jrsoftware.org/isdl.php now links to the
#               jrsoftware/issrc GitHub releases. The PINNED VERSION IS
#               UNCHANGED (6.3.3) — only the host moved. Verified reachable and
#               hashed from the GitHub release URL below.
# ---------------------------------------------------------------------------
[urls]
runner_linux_x64     = "https://github.com/actions/runner/releases/download/v{v}/actions-runner-linux-x64-{v}.tar.gz"
runner_win_x64       = "https://github.com/actions/runner/releases/download/v{v}/actions-runner-win-x64-{v}.zip"
runner_osx_arm64     = "https://github.com/actions/runner/releases/download/v{v}/actions-runner-osx-arm64-{v}.tar.gz"
cmake_linux_x86_64   = "https://github.com/Kitware/CMake/releases/download/v{v}/cmake-{v}-linux-x86_64.tar.gz"
cmake_windows_x86_64 = "https://github.com/Kitware/CMake/releases/download/v{v}/cmake-{v}-windows-x86_64.zip"
cmake_macos_universal= "https://github.com/Kitware/CMake/releases/download/v{v}/cmake-{v}-macos-universal.tar.gz"
ninja_linux          = "https://github.com/ninja-build/ninja/releases/download/v{v}/ninja-linux.zip"
ninja_win            = "https://github.com/ninja-build/ninja/releases/download/v{v}/ninja-win.zip"
ninja_mac            = "https://github.com/ninja-build/ninja/releases/download/v{v}/ninja-mac.zip"
git_win_x64          = "https://github.com/git-for-windows/git/releases/download/v{v}.windows.1/MinGit-{v}-64-bit.zip"
innosetup_win        = "https://github.com/jrsoftware/issrc/releases/download/is-6_3_3/innosetup-{v}.exe"
sevenzip_win_x64     = "https://www.7-zip.org/a/7z2409-x64.exe"
sccache_win_x64      = "https://github.com/mozilla/sccache/releases/download/v{v}/sccache-v{v}-x86_64-pc-windows-msvc.tar.gz"
python_win_x64       = "https://www.python.org/ftp/python/{v}/python-{v}-amd64.exe"
# Visual Studio Build Tools ships only an evergreen bootstrapper; the VERSION is
# pinned by passing --channelUri for the 17.12 channel to the bootstrapper, which
# is what install-buildtools.ps1 does. There is no stable per-version .exe URL
# and therefore no checksum entry for it.
vs_buildtools_bootstrap = "https://aka.ms/vs/17/release/vs_buildtools.exe"
vs_buildtools_channel   = "https://aka.ms/vs/17/release.ltsc.{v}/channel"
